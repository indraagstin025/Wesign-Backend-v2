# ═══════════════════════════════════════════════════════════
# golangci-lint configuration — SKEMA v2 (golangci-lint v2.x)
# Menegakkan TDD §2.2 (dependency rule) & TDD §11.3.1 (CI)
# ═══════════════════════════════════════════════════════════
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - misspell
    - unconvert
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - prealloc
    - gocritic
    - nilerr
    - copyloopvar
    - depguard

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      excludes:
        - G101 # hard-coded credentials (false positive di test)
    revive:
      rules:
        - name: exported
          disabled: true

    # ── Dependency rule (TDD §2.2) ──────────────────────────
    # Domain tidak boleh bergantung pada layer mana pun.
    # Use Case hanya boleh bergantung pada Domain dan pkg.
    depguard:
      rules:
        domain-layer-must-be-pure:
          files:
            - "**/internal/domain/**"
          allow:
            - $gostd
            - github.com/google/uuid
        usecase-layer-must-not-depend-on-transport-or-driver:
          files:
            - "**/internal/usecase/**"
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/wesign/wesign-backend/internal/domain
            - github.com/wesign/wesign-backend/pkg

  exclusions:
    paths:
      - internal/infrastructure/postgres/sqlc
      - mocks
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
